<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Grand Rose Tree Blooming 🌹🌳</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030208;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
const particles = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

/* Background Glow Particles */
class Particle {
  constructor() { this.reset(true); }
  reset(init) {
    this.x = Math.random() * W;
    this.y = init ? Math.random() * H : H + 40;
    this.r = 1.0 + Math.random() * 2.8;
    this.speed = 0.15 + Math.random() * 0.45;
    this.a = 0.05 + Math.random() * 0.25;
    this.col = Math.random() > 0.4 ? '#ff80ab' : '#ffd1dc';
    this.wobble = Math.random() * Math.PI * 2;
  }
  update() {
    this.y -= this.speed;
    this.x += Math.sin(this.wobble + this.y * 0.008) * 0.35;
    if (this.y < -40) this.reset(false);
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = this.col;
    ctx.globalAlpha = this.a;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}
for (let i = 0; i < 60; i++) particles.push(new Particle());

/* Easing Functions */
function ease(t) {
  return t < 0 ? 0 : t > 1 ? 1 : 1 - Math.pow(1 - t, 3);
}
function easeBack(t) {
  const c = 1.7;
  return t <= 0 ? 0 : t >= 1 ? 1 : 1 + c * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);
}

/* Tree Structure Data */
// Base trunk and major branches with rose positions
const treeBranches = [
  // Main Trunk
  { x1: 0.50, y1: 0.95, x2: 0.50, y2: 0.65, w1: 22, w2: 14, delay: 0.2 },
  
  // Left Major Branch
  { x1: 0.50, y1: 0.72, x2: 0.32, y2: 0.48, w1: 14, w2: 8, delay: 1.2 },
  { x1: 0.32, y1: 0.48, x2: 0.20, y2: 0.38, w1: 8,  w2: 4, delay: 2.2 },
  { x1: 0.32, y1: 0.48, x2: 0.38, y2: 0.35, w1: 7,  w2: 3, delay: 2.4 },

  // Right Major Branch
  { x1: 0.50, y1: 0.68, x2: 0.68, y2: 0.46, w1: 14, w2: 8, delay: 1.4 },
  { x1: 0.68, y1: 0.46, x2: 0.80, y2: 0.36, w1: 8,  w2: 4, delay: 2.5 },
  { x1: 0.68, y1: 0.46, x2: 0.62, y2: 0.32, w1: 7,  w2: 3, delay: 2.7 },

  // Center Upper Branches
  { x1: 0.50, y1: 0.65, x2: 0.48, y2: 0.42, w1: 11, w2: 6, delay: 1.6 },
  { x1: 0.48, y1: 0.42, x2: 0.52, y2: 0.25, w1: 6,  w2: 3, delay: 2.8 },
  { x1: 0.48, y1: 0.42, x2: 0.40, y2: 0.28, w1: 5,  w2: 3, delay: 3.0 },
];

/* Big Roses Layout on Branch Tips */
const bigRoses = [
  { x: 0.20, y: 0.38, delay: 4.5, scale: 1.4, colorType: 0 },
  { x: 0.38, y: 0.35, delay: 5.2, scale: 1.3, colorType: 1 },
  { x: 0.52, y: 0.25, delay: 5.8, scale: 1.6, colorType: 0 }, // Center Top Big Rose
  { x: 0.40, y: 0.28, delay: 6.4, scale: 1.25, colorType: 2 },
  { x: 0.62, y: 0.32, delay: 7.0, scale: 1.35, colorType: 1 },
  { x: 0.80, y: 0.36, delay: 7.6, scale: 1.45, colorType: 0 },
  { x: 0.30, y: 0.52, delay: 8.2, scale: 1.2, colorType: 2 },
  { x: 0.70, y: 0.50, delay: 8.8, scale: 1.2, colorType: 1 }
];

/* Leaf Clusters Config */
const leafClusters = [
  { x: 0.22, y: 0.42, delay: 3.2, count: 6, rot: -0.5 },
  { x: 0.35, y: 0.40, delay: 3.5, count: 7, rot: 0.4 },
  { x: 0.50, y: 0.32, delay: 3.8, count: 9, rot: 0.1 },
  { x: 0.42, y: 0.32, delay: 4.0, count: 6, rot: -0.3 },
  { x: 0.65, y: 0.36, delay: 4.2, count: 8, rot: 0.5 },
  { x: 0.76, y: 0.40, delay: 4.4, count: 7, rot: -0.4 },
  { x: 0.32, y: 0.56, delay: 3.0, count: 5, rot: -0.6 },
  { x: 0.68, y: 0.54, delay: 3.3, count: 5, rot: 0.6 },
];

/* Rose Presets */
const ROSE_PRESETS = [
  { petalDeep: '#880e4f', petalMid: '#d32f2f', petalLight: '#ff8a80', bud: '#c62828', core: '#ffd54f', glow: 'rgba(230, 30, 60, 0.6)' },
  { petalDeep: '#ad1457', petalMid: '#f06292', petalLight: '#f8bbd0', bud: '#ec407a', core: '#fff59d', glow: 'rgba(240, 70, 130, 0.55)' },
  { petalDeep: '#b71c1c', petalMid: '#ef5350', petalLight: '#ffcdd2', bud: '#e57373', core: '#fff8e1', glow: 'rgba(255, 60, 60, 0.5)' }
];

/* 1. Draw Roots & Base Soil */
function drawTreeRoots(elapsed) {
  const p = ease(Math.min(1, elapsed / 0.8));
  if (p <= 0) return;

  const cx = W * 0.5, cy = H * 0.95;
  ctx.save();
  ctx.translate(cx, cy);

  const soilRadius = p * 80;
  const soil = ctx.createRadialGradient(0, 10, 5, 0, 15, soilRadius * 1.8);
  soil.addColorStop(0, 'rgba(60, 35, 25, 0.95)');
  soil.addColorStop(1, 'rgba(20, 10, 8, 0.0)');
  ctx.beginPath();
  ctx.ellipse(0, 15, soilRadius * 1.8, soilRadius * 0.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = soil;
  ctx.fill();

  // Root Claws
  ctx.strokeStyle = 'rgba(50, 30, 20, 0.85)';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-20, 5); ctx.quadraticCurveTo(-50, 30, -80, 45);
  ctx.moveTo(20, 5);  ctx.quadraticCurveTo(50, 30, 85, 42);
  ctx.moveTo(0, 5);   ctx.quadraticCurveTo(10, 35, -5, 55);
  ctx.stroke();
  ctx.restore();
}

/* 2. Draw Growing Branches */
function drawTreeBranches(elapsed, time) {
  treeBranches.forEach(b => {
    const local = elapsed - b.delay;
    if (local <= 0) return;
    const p = ease(Math.min(1, local / 1.2));

    const x1 = b.x1 * W, y1 = b.y1 * H;
    const targetX2 = b.x2 * W, targetY2 = b.y2 * H;

    // Slight wind sway
    const sway = Math.sin(time * 0.8 + b.delay) * 3 * p;
    const x2 = x1 + (targetX2 - x1) * p + sway;
    const y2 = y1 + (targetY2 - y1) * p;

    const grad = ctx.createLinearGradient(x1, y1, x2, y2);
    grad.addColorStop(0, '#2e1c14');
    grad.addColorStop(0.5, '#4a2e22');
    grad.addColorStop(1, '#684333');

    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = grad;
    ctx.lineWidth = b.w1 + (b.w2 - b.w1) * p;
    ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 6;
    ctx.stroke();
    ctx.shadowBlur = 0;
  });
}

/* 3. Draw Leaves Clusters 🌿 */
function drawLeafClusters(elapsed) {
  leafClusters.forEach(lc => {
    const local = elapsed - lc.delay;
    if (local <= 0) return;
    const p = ease(Math.min(1, local / 1.0));

    const cx = lc.x * W;
    const cy = lc.y * H;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(lc.rot);
    ctx.scale(p, p);

    for (let i = 0; i < lc.count; i++) {
      const ang = (i / lc.count) * Math.PI * 2;
      const dist = 14 + (i % 3) * 8;
      const lx = Math.cos(ang) * dist;
      const ly = Math.sin(ang) * dist;

      ctx.save();
      ctx.translate(lx, ly);
      ctx.rotate(ang);

      // Detailed Leaf
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(10, -8, 22, 2, 18, 14);
      ctx.bezierCurveTo(10, 10, 4, 5, 0, 0);
      
      const lg = ctx.createLinearGradient(0, 0, 18, 10);
      lg.addColorStop(0, '#81c784');
      lg.addColorStop(0.5, '#4caf50');
      lg.addColorStop(1, '#1b5e20');
      ctx.fillStyle = lg;
      ctx.fill();

      // Vein
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(9, 4, 16, 12);
      ctx.strokeStyle = 'rgba(15, 60, 20, 0.4)';
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.restore();
    }
    ctx.restore();
  });
}

/* 4. Draw Big Blooming Roses 🌹 */
function drawBigRose(r, elapsed, time) {
  const local = elapsed - r.delay;
  if (local <= 0) return;

  const budP = ease(Math.min(1, local / 0.8));
  const openP = ease(Math.max(0, Math.min(1, (local - 0.7) / 1.5)));
  const budFade = openP > 0 ? Math.max(0, 1 - openP * 2.0) : 1;

  const cx = r.x * W;
  const cy = r.y * H;
  const pr = ROSE_PRESETS[r.colorType];
  const breathe = 1 + Math.sin(time * 1.5 + r.x * 10) * 0.03;

  ctx.save();
  ctx.translate(cx, cy);

  // BUD STAGE
  if (openP <= 0.05 && budP > 0) {
    const s = budP * r.scale;
    ctx.scale(s, s);

    ctx.beginPath();
    ctx.ellipse(0, -16, 14, 20, 0, 0, Math.PI * 2);
    const bg = ctx.createLinearGradient(0, 0, 0, -36);
    bg.addColorStop(0, pr.bud);
    bg.addColorStop(0.6, pr.petalMid);
    bg.addColorStop(1, pr.petalDeep);
    ctx.fillStyle = bg;
    ctx.shadowColor = pr.glow;
    ctx.shadowBlur = 12;
    ctx.fill();

    // Sepal Leaves
    ctx.fillStyle = '#2e7d32';
    ctx.beginPath();
    ctx.ellipse(-12, -8, 6, 12, -0.4, 0, Math.PI * 2);
    ctx.ellipse(12, -8, 6, 12, 0.4, 0, Math.PI * 2);
    ctx.fill();
  }

  // BIG BLOOMING ROSE STAGE
  if (openP > 0.03) {
    const s = (0.15 + easeBack(openP) * 0.85) * r.scale * breathe;
    ctx.scale(s, s);

    // Glowing Aura
    ctx.beginPath();
    ctx.arc(0, 0, 75, 0, Math.PI * 2);
    const gl = ctx.createRadialGradient(0, 0, 10, 0, 0, 75);
    gl.addColorStop(0, pr.glow);
    gl.addColorStop(1, 'transparent');
    ctx.fillStyle = gl;
    ctx.fill();

    // Multi-layered Large Rose Petals
    const layers = [
      { count: 7, radius: 52, width: 32, alpha: 0.80, offset: 0.0 },
      { count: 9, radius: 42, width: 26, alpha: 0.88, offset: 0.25 },
      { count: 10, radius: 32, width: 22, alpha: 0.94, offset: 0.50 },
      { count: 8,  radius: 22, width: 16, alpha: 0.98, offset: 0.75 },
      { count: 6,  radius: 13, width: 11, alpha: 1.00, offset: 1.00 }
    ];

    layers.forEach((layer, li) => {
      for (let i = 0; i < layer.count; i++) {
        const a = (i / layer.count) * Math.PI * 2 - Math.PI / 2 + layer.offset + li * 0.1;
        ctx.save();
        ctx.rotate(a);
        ctx.beginPath();

        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(layer.width * 0.7, -layer.radius * 0.3,
                          layer.width, -layer.radius * 0.75,
                          0, -layer.radius);
        ctx.bezierCurveTo(-layer.width, -layer.radius * 0.75,
                          -layer.width * 0.7, -layer.radius * 0.3,
                          0, 0);

        const pg = ctx.createLinearGradient(0, 0, 0, -layer.radius);
        if (li < 2) {
          pg.addColorStop(0, pr.petalDeep);
          pg.addColorStop(0.55, pr.petalMid);
          pg.addColorStop(1, pr.petalLight);
        } else {
          pg.addColorStop(0, pr.petalMid);
          pg.addColorStop(0.5, pr.petalLight);
          pg.addColorStop(1, '#fff0f3');
        }
        ctx.fillStyle = pg;
        ctx.globalAlpha = layer.alpha;
        ctx.shadowColor = pr.glow;
        ctx.shadowBlur = li === 0 ? 16 : 6;
        ctx.fill();
        ctx.shadowBlur = 0;

        // Inner Petal Curved Edge
        ctx.beginPath();
        ctx.moveTo(0, -2);
        ctx.quadraticCurveTo(layer.width * 0.15, -layer.radius * 0.5, 0, -layer.radius * 0.88);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
        ctx.lineWidth = 1.2;
        ctx.stroke();

        ctx.restore();
      }
    });

    // Golden Rose Center
    ctx.beginPath();
    ctx.arc(0, 0, 11, 0, Math.PI * 2);
    const cg = ctx.createRadialGradient(-3, -3, 1, 0, 0, 11);
    cg.addColorStop(0, '#fffde7');
    cg.addColorStop(0.5, pr.core);
    cg.addColorStop(1, '#ffb300');
    ctx.fillStyle = cg;
    ctx.shadowColor = 'rgba(255, 200, 50, 0.85)';
    ctx.shadowBlur = 14;
    ctx.fill();
  }

  ctx.restore();
}

/* Main Animation Loop */
let startT = 0;
function frame(now) {
  if (!startT) startT = now;
  const elapsed = (now - startT) / 1000;
  const time = now / 1000;

  ctx.clearRect(0, 0, W, H);

  // Deep Midnight Sky Background
  const bg = ctx.createRadialGradient(W / 2, H * 0.4, 0, W / 2, H * 0.5, Math.max(W, H) * 0.95);
  bg.addColorStop(0, '#250c20');
  bg.addColorStop(0.55, '#0e0512');
  bg.addColorStop(1, '#030208');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  particles.forEach(p => { p.update(); p.draw(); });

  // 1. Roots
  drawTreeRoots(elapsed);

  // 2. Trunk & Branches
  drawTreeBranches(elapsed, time);

  // 3. Leaves Clusters (🌿)
  drawLeafClusters(elapsed);

  // 4. Big Blooming Roses (🌹)
  bigRoses.forEach(r => drawBigRose(r, elapsed, time));

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
