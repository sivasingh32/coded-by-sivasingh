<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Realistic Blooming Rose 🌹</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030208;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
const particles = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

/* Background Sparkle / Particle Effect */
class Particle {
  constructor() { this.reset(true); }
  reset(init) {
    this.x = Math.random() * W;
    this.y = init ? Math.random() * H : H + 40;
    this.r = 1.0 + Math.random() * 2.5;
    this.speed = 0.15 + Math.random() * 0.4;
    this.a = 0.05 + Math.random() * 0.2;
    this.col = Math.random() > 0.4 ? '#ff9ec0' : '#ffe0ec';
    this.wobble = Math.random() * Math.PI * 2;
  }
  update() {
    this.y -= this.speed;
    this.x += Math.sin(this.wobble + this.y * 0.008) * 0.3;
    if (this.y < -40) this.reset(false);
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = this.col;
    ctx.globalAlpha = this.a;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}
for (let i = 0; i < 50; i++) particles.push(new Particle());

/* Rose Config & Growth Stages */
const STAGE = { root: 0.0, stem: 0.4, leaf: 1.5, bud: 2.3, open: 3.1 };

const rose = {
  cx: 0.5,       // Center position (Screen width percentage)
  base: 0.92,    // Ground level
  maxH: 0.52,    // Stem height
  ang: 0.0,      // Straight angle
  sway: 0.18,
  swaySpeed: 0.6,
  phase: 0,
  preset: {
    petalDeep: '#880e4f',
    petalMid: '#d32f2f',
    petalLight: '#ff8a80',
    bud: '#c62828',
    core: '#ffd54f',
    glow: 'rgba(230, 40, 70, 0.55)'
  }
};

function ease(t) {
  return t < 0 ? 0 : t > 1 ? 1 : 1 - Math.pow(1 - t, 3);
}
function easeBack(t) {
  const c = 1.7;
  return t <= 0 ? 0 : t >= 1 ? 1 : 1 + c * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);
}

/* 1. Draw Root & Soil */
function drawRoot(p) {
  if (p <= 0) return;
  const x = rose.cx * W, y = rose.base * H;
  ctx.save();
  ctx.translate(x, y);
  const s = ease(p) * 20;
  
  const soil = ctx.createRadialGradient(0, 4, 2, 0, 6, s * 1.8);
  soil.addColorStop(0, 'rgba(70, 45, 35, 0.9)');
  soil.addColorStop(1, 'rgba(40, 25, 20, 0.0)');
  ctx.beginPath();
  ctx.ellipse(0, 6, s * 1.8, s * 0.7, 0, 0, Math.PI * 2);
  ctx.fillStyle = soil;
  ctx.fill();

  ctx.strokeStyle = 'rgba(65, 40, 35, 0.8)';
  ctx.lineWidth = 1.6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-9, 4); ctx.quadraticCurveTo(-16, 16, -7, 24);
  ctx.moveTo(8, 5);  ctx.quadraticCurveTo(16, 15, 9, 23);
  ctx.moveTo(0, 3);  ctx.quadraticCurveTo(4, 18, -2, 26);
  ctx.stroke();
  ctx.restore();
}

/* 2. Draw Stem & Leaves (🌿) */
function drawStemAndLeaves(stemP, leafP, time) {
  const h = rose.maxH * H * ease(stemP);
  if (h < 2) return { tipX: rose.cx * W, tipY: rose.base * H };

  const sway = Math.sin(time * rose.swaySpeed + rose.phase) * rose.sway * (h / (rose.maxH * H));
  const x = rose.cx * W, y = rose.base * H;

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(sway * 0.15);

  // Stem Gradient
  const stemGrad = ctx.createLinearGradient(0, 0, 0, -h);
  stemGrad.addColorStop(0, '#1b5e20');
  stemGrad.addColorStop(0.4, '#2e7d32');
  stemGrad.addColorStop(1, '#66bb6a');

  ctx.beginPath();
  ctx.moveTo(-2.5, 0);
  ctx.quadraticCurveTo(5, -h * 0.5, -1.8 + sway * 2, -h);
  ctx.lineTo(1.8 + sway * 2, -h);
  ctx.quadraticCurveTo(5, -h * 0.5, 2.5, 0);
  ctx.closePath();
  ctx.fillStyle = stemGrad;
  ctx.shadowColor = 'rgba(50, 130, 50, 0.4)';
  ctx.shadowBlur = 8;
  ctx.fill();
  ctx.shadowBlur = 0;

  // Realistic Leaves (🌿)
  if (leafP > 0) {
    const leaves = [
      { pos: 0.68, side: -1, size: 1.1, rot: 0.75 },
      { pos: 0.48, side:  1, size: 1.0, rot: 0.70 },
      { pos: 0.30, side: -1, size: 0.85, rot: 0.80 }
    ];
    leaves.forEach((L, i) => {
      const lp = Math.max(0, Math.min(1, (leafP - i * 0.15) / 0.45));
      if (lp <= 0) return;
      const ly = -h * L.pos;
      const sc = ease(lp) * L.size;

      ctx.save();
      ctx.translate(sway * 1.5, ly);
      ctx.rotate(L.side * L.rot * sc);

      // Detailed Leaf Shape
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(L.side * 12 * sc, -8 * sc, L.side * 30 * sc, 4 * sc, L.side * 25 * sc, 16 * sc);
      ctx.bezierCurveTo(L.side * 15 * sc, 12 * sc, L.side * 8 * sc, 6 * sc, 0, 0);
      
      const lg = ctx.createLinearGradient(0, 0, L.side * 25 * sc, 12 * sc);
      lg.addColorStop(0, '#a5d6a7');
      lg.addColorStop(0.5, '#66bb6a');
      lg.addColorStop(1, '#2e7d32');
      ctx.fillStyle = lg;
      ctx.globalAlpha = 0.95 * sc;
      ctx.fill();

      // Leaf veins
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(L.side * 13 * sc, 6 * sc, L.side * 23 * sc, 14 * sc);
      ctx.strokeStyle = 'rgba(20, 70, 30, 0.5)';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      ctx.globalAlpha = 1;
      ctx.restore();
    });
  }
  ctx.restore();

  const tipX = x + Math.sin(sway * 0.15) * h;
  const tipY = y - Math.cos(sway * 0.15) * h;
  return { tipX, tipY };
}

/* 3. Draw Bud Before Opening */
function drawBud(tipX, tipY, budP) {
  if (budP <= 0) return;
  const s = ease(budP);
  ctx.save();
  ctx.translate(tipX, tipY);
  ctx.scale(s, s);

  ctx.beginPath();
  ctx.ellipse(0, -14, 12, 18, 0, 0, Math.PI * 2);
  const bg = ctx.createLinearGradient(0, 0, 0, -32);
  bg.addColorStop(0, rose.preset.bud);
  bg.addColorStop(0.6, rose.preset.petalMid);
  bg.addColorStop(1, rose.preset.petalDeep);
  ctx.fillStyle = bg;
  ctx.shadowColor = rose.preset.glow;
  ctx.shadowBlur = 15;
  ctx.fill();
  ctx.shadowBlur = 0;

  // Sepals (Green leaves holding the bud)
  ctx.fillStyle = '#388e3c';
  ctx.beginPath();
  ctx.ellipse(-10, -6, 5, 10, -0.4, 0, Math.PI * 2);
  ctx.ellipse(10, -6, 5, 10, 0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

/* 4. Draw Fully Open Realistic Rose Bloom 🌹 */
function drawRealisticRose(tipX, tipY, openP, time) {
  if (openP <= 0) return;
  const s = 0.12 + easeBack(openP) * 0.88;
  const pr = rose.preset;
  const breathe = 1 + Math.sin(time * 1.5) * 0.025;

  ctx.save();
  ctx.translate(tipX, tipY);
  ctx.scale(s * breathe, s * breathe);

  // Soft glowing background aura
  ctx.beginPath();
  ctx.arc(0, 0, 65, 0, Math.PI * 2);
  const gl = ctx.createRadialGradient(0, 0, 8, 0, 0, 65);
  gl.addColorStop(0, pr.glow);
  gl.addColorStop(1, 'transparent');
  ctx.fillStyle = gl;
  ctx.fill();

  // Multi-layered realistic rose petals
  const layers = [
    { count: 6, radius: 42, width: 24, alpha: 0.75, offset: 0.0 },
    { count: 8, radius: 34, width: 20, alpha: 0.85, offset: 0.3 },
    { count: 9, radius: 26, width: 17, alpha: 0.92, offset: 0.55 },
    { count: 7, radius: 18, width: 13, alpha: 0.96, offset: 0.8 },
    { count: 5, radius: 11, width: 9,  alpha: 1.0,  offset: 1.1 }
  ];

  layers.forEach((layer, li) => {
    for (let i = 0; i < layer.count; i++) {
      const a = (i / layer.count) * Math.PI * 2 - Math.PI / 2 + layer.offset + li * 0.12;
      ctx.save();
      ctx.rotate(a);
      ctx.beginPath();
      
      // Classic rose petal curve
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(layer.width * 0.7, -layer.radius * 0.3,
                        layer.width, -layer.radius * 0.75,
                        0, -layer.radius);
      ctx.bezierCurveTo(-layer.width, -layer.radius * 0.75,
                        -layer.width * 0.7, -layer.radius * 0.3,
                        0, 0);

      const pg = ctx.createLinearGradient(0, 0, 0, -layer.radius);
      if (li < 2) {
        pg.addColorStop(0, pr.petalDeep);
        pg.addColorStop(0.55, pr.petalMid);
        pg.addColorStop(1, pr.petalLight);
      } else {
        pg.addColorStop(0, pr.petalMid);
        pg.addColorStop(0.5, pr.petalLight);
        pg.addColorStop(1, '#ffebee');
      }
      ctx.fillStyle = pg;
      ctx.globalAlpha = layer.alpha;
      ctx.shadowColor = pr.glow;
      ctx.shadowBlur = li === 0 ? 14 : 6;
      ctx.fill();
      ctx.shadowBlur = 0;

      // Inner petal fold line
      ctx.beginPath();
      ctx.moveTo(0, -2);
      ctx.quadraticCurveTo(layer.width * 0.15, -layer.radius * 0.5, 0, -layer.radius * 0.88);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 1.0;
      ctx.stroke();
      ctx.restore();
    }
  });

  // Center core & stamens
  ctx.beginPath();
  ctx.arc(0, 0, 9, 0, Math.PI * 2);
  const cg = ctx.createRadialGradient(-2, -2, 1, 0, 0, 9);
  cg.addColorStop(0, '#fffde7');
  cg.addColorStop(0.5, pr.core);
  cg.addColorStop(1, '#ffb300');
  ctx.fillStyle = cg;
  ctx.shadowColor = 'rgba(255, 200, 50, 0.8)';
  ctx.shadowBlur = 12;
  ctx.fill();

  ctx.restore();
}

/* Main Animation Loop */
let startT = 0;
function frame(now) {
  if (!startT) startT = now;
  const elapsed = (now - startT) / 1000;
  const time = now / 1000;

  ctx.clearRect(0, 0, W, H);

  // Background Gradient
  const bg = ctx.createRadialGradient(W / 2, H * 0.3, 0, W / 2, H * 0.4, Math.max(W, H) * 0.9);
  bg.addColorStop(0, '#1f0b1a');
  bg.addColorStop(0.5, '#0c050e');
  bg.addColorStop(1, '#030208');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  particles.forEach(p => { p.update(); p.draw(); });

  // Ground area shade
  const ground = ctx.createLinearGradient(0, H * 0.85, 0, H);
  ground.addColorStop(0, 'transparent');
  ground.addColorStop(1, 'rgba(25, 55, 35, 0.35)');
  ctx.fillStyle = ground;
  ctx.fillRect(0, H * 0.78, W, H * 0.22);

  // Calculate Growth Progress stages
  const rootP = ease(Math.min(1, elapsed / 0.5));
  const stemP = ease(Math.max(0, Math.min(1, (elapsed - STAGE.stem) / 1.75)));
  const leafP = ease(Math.max(0, Math.min(1, (elapsed - STAGE.leaf) / 0.95)));
  const budP  = ease(Math.max(0, Math.min(1, (elapsed - STAGE.bud) / 0.8)));
  const openP = ease(Math.max(0, Math.min(1, (elapsed - STAGE.open) / 1.4)));
  const budFade = openP > 0 ? Math.max(0, 1 - openP * 2.0) : 1;

  drawRoot(rootP);
  const tip = drawStemAndLeaves(stemP, leafP, time);

  if (openP > 0.03) {
    drawRealisticRose(tip.tipX, tip.tipY, openP, time);
  } else if (budP > 0) {
    drawBud(tip.tipX, tip.tipY, budP * budFade);
  }

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
